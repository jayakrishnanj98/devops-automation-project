apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-nginx-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: php-nginx
  template:
    metadata:
      labels:
        app: php-nginx
    spec:
      volumes:
        - name: app-files
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: nginx-config

      initContainers:
        - name: copy-app-files
          image: jayakrishnanjk/devops-automation-app:2
          command: ["sh", "-c", "cp -R /var/www/html/. /shared/"]
          volumeMounts:
            - name: app-files
              mountPath: /shared

      containers:
        - name: php
          image: jayakrishnanjk/devops-automation-app:2
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: app-files
              mountPath: /var/www/html

        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: app-files
              mountPath: /var/www/html
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

