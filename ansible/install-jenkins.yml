---
- name: Install Jenkins Server
  hosts: jenkins_servers
  become: yes

  tasks:
    - name: Add Jenkins repository signing key
      ansible.builtin.rpm_key:
        state: present
        key: https://pkg.jenkins.io/rpm-stable/jenkins.io-2026.key

    - name: Add Jenkins stable repository
      ansible.builtin.yum_repository:
        name: jenkins
        description: Jenkins Stable Repository
        baseurl: https://pkg.jenkins.io/rpm-stable/
        gpgcheck: true
        gpgkey: https://pkg.jenkins.io/rpm-stable/jenkins.io-2026.key
        enabled: true

    - name: Install fontconfig
      ansible.builtin.dnf:
        name: fontconfig
        state: present

    - name: Install Jenkins
      ansible.builtin.dnf:
        name: jenkins
        state: present

    - name: Enable and start Jenkins
      ansible.builtin.systemd:
        name: jenkins
        enabled: true
        state: started
